# 关节版短训练入口：继承关节版正式配置，参数与末端版短训练一致，只检查流程。
defaults:
  - train_diffusion_transformer_tianji_rail_joint_workspace
  - _self_
task:
  env_runner:
    max_windows: 2
dataloader:
  batch_size: 2
  num_workers: 0
  persistent_workers: false
training:
  num_epochs: 2
  max_train_steps: 2
  max_val_steps: 2
  val_every: 1
  lr_warmup_steps: 0
  checkpoint_every: 1
  sample_every: 1
