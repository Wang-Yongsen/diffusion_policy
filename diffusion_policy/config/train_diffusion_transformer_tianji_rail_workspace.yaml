# 导轨 Transformer；数据路径和动作空间在命令行指定。
defaults:
- _self_
- task: tianji_rail_image
name: train_diffusion_transformer_tianji_rail
_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace
shape_meta: ${task.shape_meta}
horizon: 16
n_obs_steps: 1
n_action_steps: 8
policy:
  _target_: diffusion_policy.policy.diffusion_transformer_hybrid_image_policy.DiffusionTransformerHybridImagePolicy
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  num_inference_steps: 8
  crop_shape: null
  eval_fixed_crop: true
  obs_encoder_group_norm: true
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: true
  pred_action_steps_only: false
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: ${dataloader.batch_size}
  num_workers: ${dataloader.num_workers}
  shuffle: false
  pin_memory: ${dataloader.pin_memory}
  persistent_workers: ${dataloader.persistent_workers}
optimizer:
  transformer_weight_decay: 0.001
  obs_encoder_weight_decay: 1.0e-06
  learning_rate: 0.0001
  betas:
  - 0.9
  - 0.95
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 600
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 50
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  mode: disabled
  project: tianji_rail
  resume: false
  name: ${name}
checkpoint:
  topk:
    monitor_key: ${eval:"\"val_loss\" if ${task.dataset.val_ratio} > 0 else \"train_loss\""}
    mode: min
    k: 3
    format_str: epoch={epoch:04d}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
hydra:
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_tianji_rail_${task.action_space}
