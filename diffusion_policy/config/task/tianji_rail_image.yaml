# 导轨观测与动作契约。
name: tianji_rail_image
# 模型动作：eef 58维（臂9+9、手20+20）；joint 54维（臂7+7、手20+20）。
action_space: eef
# Hz；须匹配 Zarr target_fps 和部署 policy_hz。
sample_hz: 30
# [通道,高,宽]；关闭缩放时须匹配原图。
image_shape:
- 3
- 480
- 640
shape_meta: ${task.shape_meta_options.${task.action_space}}
# 位置 m、关节角 rad；eef 观测旋转为 xyzw 四元数，动作旋转为6D，均不缩放。
# 动作是绝对目标。Zarr仍保存 xyz+rotvec，由Dataset转换为模型表示。
shape_meta_options:
  eef:
    obs:
      camera_0:
        shape: ${task.image_shape}
        type: rgb
      camera_1:
        shape: ${task.image_shape}
        type: rgb
      camera_2:
        shape: ${task.image_shape}
        type: rgb
      robot_eef_pose:
        shape:
        - 14
        type: low_dim
      hand_joint:
        shape:
        - 40
        type: low_dim
    action:
      shape:
      - 58
  joint:
    obs:
      camera_0:
        shape: ${task.image_shape}
        type: rgb
      camera_1:
        shape: ${task.image_shape}
        type: rgb
      camera_2:
        shape: ${task.image_shape}
        type: rgb
      robot_joint:
        shape:
        - 14
        type: low_dim
      hand_joint:
        shape:
        - 40
        type: low_dim
    action:
      shape:
      - 54
dataset:
  _target_: diffusion_policy.dataset.tianji_rail_image_dataset.TianjiRailImageDataset
  action_space: ${task.action_space}
  dataset_path: ../bimanual-teleop/datasets/rail_place_10hz.zarr
  sample_hz: ${task.sample_hz}
  shape_meta: ${task.shape_meta}
  image_shape: ${task.image_shape}
  resize_enabled: false
  resize_interpolation: area
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  seed: ${training.seed}
  # 按原始示范来源划分；窗口不跨连续片段边界。
  val_ratio: 0.05
env_runner:
  _target_: diffusion_policy.env_runner.tianji_rail_offline_runner.TianjiRailOfflineRunner
  dataset: ${task.dataset}
  n_action_steps: ${n_action_steps}
  batch_size: 8
  window_stride: 8
  max_windows: null
