# 关节版导轨任务：观测和动作均使用关节空间，仅用于训练和离线评估；真机部署暂只支持末端版。
name: tianji_rail_joint_image
# 训练观测和动作的采样频率，Hz；须与Zarr的target_fps一致。
sample_hz: 30
# Dataset 输出尺寸，顺序为 [通道,高,宽]；当前三路原图均为宽640、高480。
# 当前关闭缩放，必须填写原图尺寸 [3,480,640]；缩小时同时将 dataset.resize_enabled 改为 true。
image_shape: [3, 480, 640]
# 观测字段和尺寸契约；新增模态需相应编码器，不能只加字段名。
shape_meta:
  obs:
    # 三路 RGB 共用 image_shape；当前按原图尺寸读取，三路原图尺寸须一致。
    camera_0: {shape: '${task.image_shape}', type: rgb}
    camera_1: {shape: '${task.image_shape}', type: rgb}
    camera_2: {shape: '${task.image_shape}', type: rgb}
    # 左右臂各 7 个实测关节角，共 14 维，弧度。
    robot_joint: {shape: [14], type: low_dim}
    # 左右手各 20 个绝对关节角，弧度。
    hand_joint: {shape: [40], type: low_dim}
  # 左臂7、右臂7、左手20、右手20；绝对关节目标，弧度，不偏移标签。
  action: {shape: [54]}
dataset:
  # 按需读取 RGB，按原始示范划分、连续片段内采样。
  _target_: diffusion_policy.dataset.tianji_rail_image_dataset.TianjiRailImageDataset
  # 校验Zarr的action_space属性及54维动作。
  action_space: joint
  # 数据路径；每次运行在命令行覆盖。
  dataset_path: ../bimanual-teleop/datasets/rail_place3_joint_30hz.zarr
  # 校验zarr的target_fps及每个连续片段的时间间隔。
  sample_hz: ${task.sample_hz}
  # 尺寸契约与输出尺寸共用任务配置，勿独立改为不同值。
  shape_meta: ${task.shape_meta}
  image_shape: ${task.image_shape}
  # false 保留原图，仅转换通道顺序和像素数值格式；true 时读取样本缩放到 task.image_shape。
  resize_enabled: false
  # 仅 resize_enabled=true 时生效。
  resize_interpolation: area
  # 完整动作窗口长度；不足长度不产样本，不补齐，不跨剩余缺口。
  horizon: ${horizon}
  # 只读取前几个观测帧；需不超过 horizon，与 Policy 保持一致。
  n_obs_steps: ${n_obs_steps}
  # 来源划分随机种子；正式比较实验保持不变。
  seed: ${training.seed}
  # 按独立示范来源留出5%；单演示须显式改为0。
  val_ratio: 0.05
env_runner:
  # 离线动作指标：各臂和各手关节平均绝对误差，单位度；不估计实机放置成功率。
  _target_: diffusion_policy.env_runner.tianji_rail_offline_runner.TianjiRailOfflineRunner
  # 重用同一数据、划分和确定性图像预处理；不重拟合 Policy 的归一化参数。
  dataset: ${task.dataset}
  # 执行段从 n_obs_steps-1 开始，长度应能放入完整动作窗口。
  n_action_steps: ${n_action_steps}
  # 离线预测 batch；显存不足时减小。
  batch_size: 8
  # 每个连续片段内评估窗口起点间隔。
  window_stride: 8
  # null 评估全部所选窗口；冒烟可设较小正整数。
  max_windows: null
