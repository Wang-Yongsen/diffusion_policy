# 导轨 Transformer；数据路径和动作空间在命令行指定。
# 短训练仅减少轮数与批次，不连接设备。
defaults:
- train_diffusion_transformer_tianji_rail_workspace
- _self_
task:
  env_runner:
    max_windows: 2
dataloader:
  batch_size: 2
  num_workers: 0
  persistent_workers: false
training:
  num_epochs: 2
  max_train_steps: 2
  max_val_steps: 2
  val_every: 1
  lr_warmup_steps: 0
  checkpoint_every: 1
  sample_every: 1
