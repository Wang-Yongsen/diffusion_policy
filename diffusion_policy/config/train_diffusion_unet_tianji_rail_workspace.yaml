# 导轨 UNet；数据路径和动作空间在命令行指定。
defaults:
- train_diffusion_unet_ddim_hybrid_workspace
- override task: tianji_rail_image
- _self_
name: train_diffusion_unet_tianji_rail
_target_: diffusion_policy.workspace.train_diffusion_unet_tianji_rail_workspace.TrainDiffusionUnetTianjiRailWorkspace
dataloader:
  num_workers: 4
  persistent_workers: true
val_dataloader:
  batch_size: ${dataloader.batch_size}
  num_workers: ${dataloader.num_workers}
  pin_memory: ${dataloader.pin_memory}
  persistent_workers: ${dataloader.persistent_workers}
optimizer:
  betas:
  - 0.9
  - 0.95
training:
  resume: false
  num_epochs: 600
  checkpoint_every: 10
  val_every: 5
logging:
  mode: disabled
  project: tianji_rail
  resume: false
  name: ${name}
checkpoint:
  topk:
    monitor_key: ${eval:"\"val_loss\" if ${task.dataset.val_ratio} > 0 else \"train_loss\""}
    mode: min
    k: 3
    format_str: epoch={epoch:04d}.ckpt
hydra:
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_tianji_rail_unet_${task.action_space}
