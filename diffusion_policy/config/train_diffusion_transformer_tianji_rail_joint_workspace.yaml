# 关节版正式训练入口：继承末端版正式配置，只替换任务为关节观测和54维关节动作。
defaults:
  - train_diffusion_transformer_tianji_rail_workspace
  - override task: tianji_rail_joint_image
  - _self_
name: train_diffusion_transformer_tianji_rail_joint
hydra:
  run:
    # 与末端版实验区分目录；恢复时明确指定原目录。
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_tianji_rail_joint
