# 原始数据转换配置；CLI 需显式传 --conversion-config，不传仍使用旧严格模式。
# strict：原主相机时刻及原阈值；repair：下列网格、短缺口和暂停规则生效。
mode: repair
# 输出频率，Hz；默认 30。改变后需重新生成数据，时间窗口对应的秒数也会变化。
target_fps: 30
# 每路相机最多连续修复的未匹配点数；0 关闭复用。先保持 2，调大前抽查旧画面年龄。
max_missing_camera_frames: 2
# 正常最近图像匹配容差，ms；默认 20，调大可能增加跨相机时间差。
camera_match_tolerance_ms: 20
# 相邻实测状态插值两端最大间隔，ms；默认 100，降低更严格，升高需检查动态误差。
max_state_interp_gap_ms: 100
# 最近成功提交指令最大年龄，ms；默认 50。动作只保持过去目标，不能复用过期指令。
max_command_age_ms: 50
# checked_compress：仅合并有明确 merge:true 复核的暂停；keep：始终保留暂停边界。
pause_policy: checked_compress
# 相机 source_time_ms 与 time_ns 偏移突变识别阈值，ms；默认 100。
# 应高于时钟抖动、低于要识别的暂停；三路归属不一致直接报错，不能盲目放宽。
pause_offset_tolerance_ms: 100
# 按 source_episode 和暂停后主相机原始帧索引复核；缺省保留边界。
# 每项必须有 merge 布尔值和非空 reason；仅端点相近不足以确认整个暂停连续。
# 示例：episode_000000: {1341: {merge: false, reason: "缺少暂停期间记录，保留边界"}}
# 通用配置不绑定某条演示；实际接缝结论保存在任务的转换配置中。
pause_reviews: {}
